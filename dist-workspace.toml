[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app:
#   msi     - Windows installer; adds the install dir to PATH by default and can
#             be uninstalled from "Apps & features"
#   shell   - curl | sh installer for Linux and macOS
# Archives (tar.gz / zip) are produced for every target regardless, which is what
# makes the Linux build "download and run".
installers = ["msi", "shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Both Linux targets are musl so the binaries are fully static and indifferent to
# the host's glibc version.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Where to host releases
hosting = "github"
